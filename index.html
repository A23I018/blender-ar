<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>3Dモデル AR表示</title>

  <style>
    body {
      background: #171717;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }

    img {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 24px;
      background: #168b50;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <h1>3Dモデル AR</h1>
  <p>ボタンを押して、現実の風景にモデルを表示します。</p>

  <a rel="ar" href="model.usdz">
    
    <br>
    ARで表示する
  </a>
</body>
</html>
